spring:
  config:
    import: 
      - database-config.yml
      - eureka-client-config.yml
      - circuit-breaker-config.yml
      - security-config.yml
 
  application:
    name: venta-service

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true


resilience4j:
    instances:
      producto-service-read:
        base-config: default
        ignore-exceptions:
          - feign.FeignException.NotFound
          - com.electrodostore.venta_service.exception.ProductoNotFoundException

      producto-service-write:
        base-config: default
        ignoreExceptions:
          - feign.FeignException.NotFound
          - com.electrodostore.venta_service.exception.ProductoStockInsuficienteException

      cliente-service:
        base-config: default
        ignore-exceptions:
          - feign.FeignException.NotFound
          - com.electrodostore.venta_service.exception.ClienteNotFoundException


server:
  port: ${PORT:9191}