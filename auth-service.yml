spring:
  config:
    import: 
      - database-config.yml
      - eureka-client-config.yml
      - circuit-breaker-config.yml
      - security-config.yml

  application:
    name: auth-service

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true


resilience4j:
  instances:
    cliente-service:
      base-config: default
      ignore-exceptions:
        - feign.FeignException.NotFound
        - com.electrodostore.carrito_service.exception.ClienteNotFoundException

#Clave privada y pública para firma y validación de JWT
jwt:
  private:
    key: classpath:keys/private.pem
  public:
    key: classpath:keys/public.pem

  user:
    generator: ${JWT_USER_GENERATOR}


server:
  port: ${PORT:7474}
