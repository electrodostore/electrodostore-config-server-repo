spring:
  config:
    import: 
      - eureka-client-config.yml
      - security-config.yml

  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: producto-service
          uri: lb://producto-service
          predicates:
            - Path=/api/productos/**
          filters:
            - StripPrefix=1

        - id: cliente-service
          uri: lb://cliente-service
          predicates:
            - Path=/api/clientes/**
          filters:
            - StripPrefix=1

        - id: carrito-service
          uri: lb://carrito-service
          predicates:
            - Path=/api/carritos/**
          filters:
            - StripPrefix=1

        - id: venta-service
          uri: lb://venta-service
          predicates:
            - Path=/api/ventas/**
          filters:
            - StripPrefix=1

        - id: auth-service
          uri: lb://auth-service
          predicates:
              - Path=/api/auth/**
          filters:
            - StripPrefix=1

server:
  port: ${PORT:9090}